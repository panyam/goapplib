syntax = "proto3";
package content.collections.v1;

import "dal/v1/annotations.proto";
import "collections/v1/models.proto";

option go_package = "github.com/panyam/goapplib/content/gen/gorm/collections/v1;collectionsv1gorm";

// CollectionGORM is the GORM model for Collection.
message CollectionGORM {
  option (dal.v1.gorm) = {
    source: "content.collections.v1.Collection"
    table: "collections"
  };

  string id = 1 [(dal.v1.column) = {
    gorm_tags: ["primaryKey"]
  }];

  // Name - indexed for uniqueness within parent
  string name = 2 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_owner_parent_name,priority:4"]
  }];
  string normalized_name = 3 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_owner_parent_name,priority:5"]
  }];

  // Ownership - composite index for listing user's collections
  string owner_type = 10 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_owner_parent,priority:1", "index:idx_collections_owner_parent_name,priority:1"]
  }];
  string owner_id = 11 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_owner_parent,priority:2", "index:idx_collections_owner_parent_name,priority:2"]
  }];

  // Hierarchy
  string parent_id = 15 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_parent", "index:idx_collections_owner_parent,priority:3", "index:idx_collections_owner_parent_name,priority:3"]
  }];

  // Path as JSON array - needs serializer
  repeated string path = 16 [(dal.v1.column) = {
    gorm_tags: ["serializer:json", "type:text"]
  }];

  int32 depth = 17 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_depth"]
  }];

  // Type - indexed for filtering
  string type = 21 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_type"]
  }];

  // Visibility - indexed for filtering
  CollectionVisibility visibility = 35 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collections_visibility"]
  }];

  // Status - default value
  CollectionStatus status = 40 [(dal.v1.column) = {
    gorm_tags: ["default:1"]
  }];
}

// CollectionItemGORM is the GORM model for CollectionItem (join table).
// Composite primary key: (collection_id, entity_id)
message CollectionItemGORM {
  option (dal.v1.gorm) = {
    source: "content.collections.v1.CollectionItem"
    table: "collection_items"
  };

  // Composite primary key
  string collection_id = 1 [(dal.v1.column) = {
    gorm_tags: ["primaryKey", "index:idx_collection_items_collection,priority:1"]
  }];
  string entity_id = 2 [(dal.v1.column) = {
    gorm_tags: ["primaryKey", "index:idx_collection_items_entity,priority:1", "index:idx_collection_items_collection,priority:2"]
  }];

  // Ordering - indexed for sorted queries
  int32 display_order = 10 [(dal.v1.column) = {
    gorm_tags: ["index:idx_collection_items_collection,priority:3"]
  }];

  // Metadata - needs type override
  string metadata = 25 [(dal.v1.column) = {
    gorm_tags: ["type:text"]
  }];
}
