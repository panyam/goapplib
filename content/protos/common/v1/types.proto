syntax = "proto3";
package content.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/panyam/goapplib/content/gen/go/common/v1;commonv1";

// Generic entity reference used across all content services.
// This pattern allows attaching metadata (likes, tags, notes, etc.) to any entity.
message EntityRef {
  // Type of the entity (e.g., "document", "post", "video", "song")
  string entity_type = 1;
  // Unique identifier within the entity type
  string entity_id = 2;
}

// Standard pagination request used across all list operations.
message PaginationRequest {
  // Maximum number of items to return (default varies by service)
  int32 page_size = 1;
  // Token for fetching the next page (from previous response)
  string page_token = 2;
}

// Standard pagination response included in all list responses.
message PaginationResponse {
  // Token to fetch the next page (empty if no more pages)
  string next_page_token = 1;
  // Total count of items (may be approximate for large datasets)
  int32 total_count = 2;
}
