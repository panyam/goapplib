syntax = "proto3";
package content.tags.v1;

import "dal/v1/annotations.proto";
import "tags/v1/models.proto";

option go_package = "github.com/panyam/goapplib/content/gen/datastore/tags/v1;tagsv1datastore";

// TagDatastore is the Datastore model for Tag.
message TagDatastore {
  option (dal.v1.datastore_options) = {
    source: "content.tags.v1.Tag"
    kind: "Tag"
  };

  // ID stored in key, not as property
  string id = 1 [(dal.v1.column) = {
    datastore_tags: ["-"]
  }];

  // Name-value pair - for metadata tags (e.g., name="venue", value="Wembley")
  string name = 2;
  // Normalized name (computed by service, readonly)
  string normalized_name = 3;
  string value = 4;
  // Normalized value (computed by service, readonly)
  string normalized_value = 5;

  // Visual
  string color = 7;
  string description = 8 [(dal.v1.column) = {
    datastore_tags: ["noindex"]
  }];
  int32 display_order = 9;

  // Ownership - owner_id in "type:id" format (e.g., "user:123")
  string owner_id = 10;

  // Stats
  int64 usage_count = 15;

  // Lifecycle
  string redirect_to_tag_id = 17;

  // creator_id - same type, auto-handled
  string creator_id = 22;
  // created_at, updated_at - same type (Timestamp), auto-handled
}

// EntityTagDatastore is the Datastore model for EntityTag.
// Key is composite: tag_id + entity_id + tagged_by
// This allows multiple users to independently apply/remove the same shared tag.
message EntityTagDatastore {
  option (dal.v1.datastore_options) = {
    source: "content.tags.v1.EntityTag"
    kind: "EntityTag"
  };

  // All three fields form the logical composite key
  string tag_id = 1;
  string entity_id = 2;
  string tagged_by = 3;
}

// TagUsageCountsDatastore is the Datastore model for denormalized tag counts.
message TagUsageCountsDatastore {
  option (dal.v1.datastore_options) = {
    source: "content.tags.v1.TagUsageCounts"
    kind: "TagUsageCounts"
    implement_property_loader: true
  };

  // Key is entity_id
  string entity_id = 1;
  int64 total_count = 2;

  // JSON-serialized map of name to count
  map<string, int64> by_name = 3 [(dal.v1.column) = {
    datastore_tags: ["noindex"]
  }];
}
