syntax = "proto3";
package content.tags.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/panyam/goapplib/content/gen/go/tags/v1;tagsv1";

// TagScope defines visibility of a tag.
enum TagScope {
  TAG_SCOPE_UNSPECIFIED = 0;
  TAG_SCOPE_PRIVATE = 1;        // Only owner sees
  TAG_SCOPE_SHARED = 2;         // Visible to team/org
  TAG_SCOPE_PUBLIC = 3;         // Visible to everyone
}

// TagType defines the value type for querying and display.
enum TagType {
  TAG_TYPE_UNSPECIFIED = 0;
  TAG_TYPE_STRING = 1;          // Default - text value
  TAG_TYPE_NUMBER = 2;          // Numeric value (enables range queries)
  TAG_TYPE_DATE = 3;            // Date value (enables date range queries)
  TAG_TYPE_BOOLEAN = 4;         // Boolean value
}

// TagStatus manages tag lifecycle, especially for migrations (e.g., private → public).
enum TagStatus {
  TAG_STATUS_UNSPECIFIED = 0;
  TAG_STATUS_ACTIVE = 1;        // Normal state, fully operational
  TAG_STATUS_MIGRATING = 2;     // Being migrated, no new EntityTags allowed (409 Conflict)
  TAG_STATUS_REDIRECT = 3;      // Replaced by another tag, follows redirect
  TAG_STATUS_DELETED = 4;       // Soft deleted, pending cleanup
}

// EntityTagVisibility controls who can see a specific tag application.
// This is separate from tag ownership - a public tag can have private applications.
enum EntityTagVisibility {
  ENTITY_TAG_VISIBILITY_UNSPECIFIED = 0;
  ENTITY_TAG_VISIBILITY_PRIVATE = 1;   // Only tagged_by user sees this application
  ENTITY_TAG_VISIBILITY_SHARED = 2;    // Org/team members see this application
  ENTITY_TAG_VISIBILITY_PUBLIC = 3;    // Everyone sees this application
}

// Tag represents a label or key-value metadata that can be attached to entities.
//
// Design: Tags and metadata are unified:
// - Pure tag: key is empty, value is the label (e.g., "Favorites", "Rock")
// - Metadata: key is present (e.g., key="venue", value="Wembley Stadium")
//
// Uniqueness: (owner_type, owner_id, normalized_key, normalized_value)
// must be unique. This prevents duplicate tags/metadata.
//
// Normalization: The service computes normalized_key and normalized_value
// from key and value. Clients never provide normalized values directly.
message Tag {
  // Unique identifier
  string id = 1;

  // Key-Value pair
  // If key is empty, this is a pure tag (label only).
  // If key is present, this is metadata (key-value pair).
  string key = 2;

  // Normalized key (readonly - computed by service, e.g., lowercase/trimmed).
  // Used for uniqueness checks. "Venue" and "venue" become same normalized_key.
  // Clients can read this to understand matching behavior, but cannot set it.
  string normalized_key = 3;

  // The display value. Always required.
  // For pure tags: "Rock", "Favorites", "To Read"
  // For metadata: "Wembley Stadium", "1985", "5"
  string value = 4;

  // Normalized value (readonly - computed by service, e.g., lowercase/trimmed).
  // Used for uniqueness checks. "Rock" and "rock" become same normalized_value.
  // Clients can read this to understand matching behavior, but cannot set it.
  string normalized_value = 5;

  // Value type for querying and display
  TagType type = 6;

  // Visual properties
  string color = 7;             // Hex "#FF5733" or named "blue"
  string description = 8;       // Optional description
  int32 display_order = 9;      // For ordering in UI

  // Ownership
  string owner_type = 10;       // "user", "org", "system"
  string owner_id = 11;         // ID of owner (user ID, org ID, or empty for system)
  TagScope scope = 12;          // Visibility scope

  // Statistics (denormalized for performance)
  // Counts unique (entity_type, entity_id) pairs, NOT EntityTag rows.
  // If 3 users tag same book, usage_count = 1.
  int64 usage_count = 15;

  // Lifecycle management (for migrations like private → public)
  TagStatus status = 16;
  // If status=REDIRECT, this points to the replacement tag.
  // Queries and operations should follow the redirect.
  string redirect_to_tag_id = 17;

  // Metadata
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  string creator_id = 22;       // User who created the tag
}

// EntityTag represents the association between a tag and an entity.
// This is the join table that allows any entity to have multiple tags.
//
// Uniqueness: (tag_id, entity_type, entity_id, tagged_by) must be unique.
// This allows multiple users to independently apply/remove the same shared tag.
// For example, both User A and User B can tag Book B1 with shared "rock" tag.
message EntityTag {
  // Tag being applied
  string tag_id = 1;

  // Entity being tagged
  string entity_type = 2;       // e.g., "song", "document", "post"
  string entity_id = 3;

  // Who applied this tag (part of uniqueness constraint)
  string tagged_by = 4;

  // Visibility of THIS application (not the tag itself).
  // A public tag can still have private applications.
  // Example: User privately tracks "Rock" on a book without public endorsement.
  EntityTagVisibility visibility = 5;

  // When the tag was applied
  google.protobuf.Timestamp created_at = 10;
}

// TagUsageCounts provides aggregated tag statistics for an entity.
// Optional: for apps that want to show "10 tags" without fetching all tags.
message TagUsageCounts {
  string entity_type = 1;
  string entity_id = 2;

  // Total number of tags on this entity
  int64 total_count = 3;

  // Count by key (for metadata grouping)
  // e.g., {"": 5, "venue": 2, "year": 1} means 5 pure tags, 2 venues, 1 year
  map<string, int64> by_key = 4;

  google.protobuf.Timestamp updated_at = 5;
}
