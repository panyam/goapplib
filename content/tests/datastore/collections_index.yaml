# Datastore indexes for collections service
# Deploy with: gcloud datastore indexes create collections_index.yaml

indexes:

- kind: Collection
  properties:
  - name: owner_type
  - name: owner_id
  - name: parent_id
  - name: status
  - name: display_order

- kind: Collection
  properties:
  - name: owner_type
  - name: owner_id
  - name: parent_id
  - name: status
  - name: created_at
    direction: desc

- kind: Collection
  properties:
  - name: owner_type
  - name: owner_id
  - name: parent_id
  - name: status
  - name: normalized_name

- kind: Collection
  properties:
  - name: owner_type
  - name: owner_id
  - name: parent_id
  - name: normalized_name
  - name: status

- kind: Collection
  properties:
  - name: status
  - name: path

- kind: CollectionItem
  properties:
  - name: collection_id
  - name: display_order

- kind: CollectionItem
  properties:
  - name: collection_id
  - name: added_at
    direction: desc

- kind: CollectionItem
  properties:
  - name: collection_id
  - name: entity_type
  - name: display_order

- kind: CollectionItem
  properties:
  - name: entity_type
  - name: entity_id

- kind: CollectionItem
  properties:
  - name: collection_id
  - name: display_order
    direction: desc
