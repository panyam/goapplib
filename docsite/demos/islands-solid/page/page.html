{{ define "page" }}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islands: a Solid island over a placeholder</title>
{{ template "IslandPreloads" .Preloads }}
<style>
  [data-slot] { border: 2px solid #34d399; border-radius: 6px; padding: .6rem .8rem; margin: .4rem 0; min-height: 4.5rem; }
  .skeleton { height: 1rem; border-radius: 4px; background: #6b728055; margin: .4rem 0; }
  .skeleton.short { width: 40%; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0; }
  ol { margin: .3rem 0; padding-left: 1.4rem; font-size: 14px; }
</style>
</head>
<body>
<ol id="steps"></ol>
<section data-slot="main">
  <div class="skeleton" data-fallback></div>
  <div class="skeleton short" data-fallback></div>
  <noscript>The counter needs JavaScript.</noscript>
</section>
<div class="row">
  <button id="slow" type="button">Reload with a 1.5 s delay, to see the placeholder</button>
  <button id="overlay" type="button">Show the ?islands overlay</button>
</div>
{{ template "PageSpecScript" .Spec }}
<script type="module" src="{{ .Main }}"></script>
</body>
</html>{{ end }}
