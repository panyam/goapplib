# Regenerate with `make exercise-wasmhost-gen`. Local plugins only: protoc-gen-go and
# protoc-gen-connect-go from `go install`, protoc-gen-es from this exercise's node_modules.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../gen/go
    opt: paths=source_relative
  - local: ../node_modules/.bin/protoc-gen-es
    out: ../web/gen
    opt: target=ts
