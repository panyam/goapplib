<!-- goapplib/templates/page/Islands.html -->
<!--
A page spec (the page package) as the JSON script tsappkit's island page reads
to mount its islands. Render it with the spec as dot:
{{ template "PageSpecScript" .Spec }}. Any spec type with a JSON method works,
so an app's own spec that embeds page.Spec does too.
-->
{{ define "PageSpecScript" }}<script type="application/json" id="page-spec">{{ .JSON }}</script>{{ end }}
